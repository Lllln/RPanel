[package]
name = "rpanel"
version = "0.1.0"
edition = "2024"
publish = false

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
env_logger = { version = "0.11", default-features = false }
log = "0.4"
raw-window-handle = "0.6"
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "libc", "NSEvent", "NSGraphics", "NSPasteboard", "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString"] }
winit = { version = "0.30", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
